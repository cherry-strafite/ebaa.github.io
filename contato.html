<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato — NEXORA</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav class="navbar">

            <a href="index.html" class="logo">
                NEXO<span>RA</span>
            </a>

            <div class="menu">
                <a href="index.html">Home</a>
                <a href="sobre.html">Sobre</a>
                <a href="projetos.html">Projetos</a>
                <a href="contato.html">Contato</a>
            </div>

            <a href="contato.html" class="nav-button">
                Começar →
            </a>

        </nav>
    </header>


    <main>

        <section class="page-hero">

            <p class="section-label">04 — CONTATO</p>

            <h1>
                Vamos criar
                <span>algo incrível.</span>
            </h1>

            <p>
                Tem uma ideia? Conta pra gente.
            </p>

        </section>


        <section class="contact-section">

            <form id="contactForm">

                <label>
                    Seu nome
                    <input
                        type="text"
                        id="name"
                        placeholder="Digite seu nome"
                        required
                    >
                </label>


                <label>
                    Seu e-mail
                    <input
                        type="email"
                        id="email"
                        placeholder="voce@email.com"
                        required
                    >
                </label>


                <label>
                    Sua mensagem
                    <textarea
                        id="message"
                        rows="6"
                        placeholder="Conte sua ideia..."
                        required
                    ></textarea>
                </label>


                <button type="submit" class="button primary">
                    Enviar mensagem →
                </button>

            </form>

        </section>

    </main>


    <footer>
        <p>© 2026 NEXORA — Built for the future.</p>
    </footer>


    <script src="js/script.js"></script>

</body>
</html>
